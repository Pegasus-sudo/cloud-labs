services:
  user-service:
    build: ./user-service
    ports:
      - "5001:5000"
    networks:
      - lab-net

  order-service:
    build: ./order-service
    ports:
      - "5002:5000"
    networks:
      - lab-net

  product-service:
    build: ./product-service
    networks:
      - lab-net

  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - order-service
      - product-service
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge

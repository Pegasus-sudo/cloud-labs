limit_req_zone $binary_remote_addr zone=product_limit:10m rate=5r/s;

server {
    listen 80;

    location /api/users {
        proxy_pass http://user-service:5000/users;
    }

    location /api/orders {
        proxy_pass http://order-service:5000/orders;
    }

    location /api/products {
        limit_req zone=product_limit burst=2 nodelay;
        proxy_pass http://product-service:5000/products;
    }
}
